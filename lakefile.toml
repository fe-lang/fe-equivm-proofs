name = "FeEquiVMProofs"
version = "0.1.0"
defaultTargets = ["FeProofs"]

# Local wiring: EquiVM's and EVMLean's `fe-stack` branches (`clz` and `precompiles`), to be replaced by pinned revisions.
[[require]]
name = "EquiVM"
path = "../EquiVM-fe"

[[lean_lib]]
name = "Fe"

[[lean_lib]]
name = "FeProofs"

# ECDSARECOVER for EVMLean, by the exported model of fevm's secp256k1 code: see
# `FeProofs/Precompiles/Secp256k1/Main.lean`.  The export audit builds it.
[[lean_exe]]
name = "ecrecover"
root = "FeProofs.Precompiles.Secp256k1.Main"
