name = "FeEquiVMProofs"
version = "0.1.0"
defaultTargets = ["FeProofs"]

# EquiVM's `lean-4.35` branch: Lean 4.35, with EVMLean's `lean-4.35` (and EthLib).
[[require]]
name = "EquiVM"
git = "https://github.com/sbillig/EquiVM"
rev = "e108ee74abb3a4375af37fb1abad7553f1a0bb4e"

# fe-spec, a formal semantics of Fe: the model monad of exported code (`Fe.Core`, `Fe.Partial`,
# `Fe.Embed`) and the interpreter of the compiler's normalized IR, which `Fe/EVM/SpecHost.lean`
# runs on the EVM world.
[[require]]
name = "fe-spec"
path = "../fe-spec"

# The model library: this package's modules under `Fe`.  fe-spec's library has the others.
[[lean_lib]]
name = "FeModel"
globs = ["FeModel", "Fe.EVM.+", "Fe.Sonatina.+"]

[[lean_lib]]
name = "FeProofs"

# ECDSARECOVER for EVMLean, by the exported model of fevm's secp256k1 code: see
# `FeProofs/Precompiles/Secp256k1/Main.lean`.  The export audit builds it.
[[lean_exe]]
name = "ecrecover"
root = "FeProofs.Precompiles.Secp256k1.Main"
