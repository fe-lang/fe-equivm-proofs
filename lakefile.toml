name = "FeEquiVMProofs"
version = "0.1.0"
defaultTargets = ["FeProofs"]

[[require]]
name = "EquiVM"
git = "https://github.com/argotorg/EquiVM"
rev = "fc74a6466b92113a6fe16d577de0f553ee46f7cf"

[[lean_lib]]
name = "Fe"

[[lean_lib]]
name = "FeProofs"

# ECDSARECOVER for EVMLean, by the exported model of fevm's secp256k1 code: see
# `FeProofs/Ecrecover/Main.lean`.  The export audit builds it.
[[lean_exe]]
name = "ecrecover"
root = "FeProofs.Ecrecover.Main"
