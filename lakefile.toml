name = "FeEquiVMProofs"
version = "0.1.0"
defaultTargets = ["FeProofs"]

# Local wiring: EquiVM's and EVMLean's `clz` branches, to be replaced by pinned revisions.
[[require]]
name = "EquiVM"
path = "../EquiVM-clz"

[[lean_lib]]
name = "Fe"

[[lean_lib]]
name = "FeProofs"

# ECDSARECOVER for EVMLean, by the exported model of fevm's secp256k1 code: see
# `FeProofs/Ecrecover/Main.lean`.  The export audit builds it.
[[lean_exe]]
name = "ecrecover"
root = "FeProofs.Ecrecover.Main"
